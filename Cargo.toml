[package]
name = "uppercut"
version = "0.4.0"
authors = ["sergey-melnychuk"]
edition = "2018"
description = "Small and simple actor model implementation"
license = "MIT"
documentation = "https://github.com/sergey-melnychuk/uppercut"
homepage = "https://github.com/sergey-melnychuk/uppercut"
repository = "https://github.com/sergey-melnychuk/uppercut"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[features]
default = []
host = ["get_if_addrs"]

[dependencies]
mio = { version = "0.8", features = ["os-poll", "net"] }
core_affinity = "0.5"
crossbeam-channel = "0.5"
parsed = "0.3.0"
bytes = "1.1"
get_if_addrs = { version = "0.5", optional = true }

[dev-dependencies]
bencher = "0.1.5"
num_cpus = "1.13"
clap = "4.5"
rand = "0.7"
log = "0.4"
env_logger = "0.11"

[[bench]]
name = "workload"
harness = false

[[bench]]
name = "mailbox"
harness = false

[[bench]]
name = "scheduler"
harness = false
